<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud Laboral</title>
    <link rel="stylesheet" href="solicitud.css">
</head>

<body>

    <main>
        <section class="form-container">

            <header class="form-header">
                <span class="eyebrow">EJERCICIO 4</span>
                <h1>Solicitud laboral</h1>
                <p>Completa tus datos y adjunta tu hoja de vida.</p>
            </header>

            <form
                action="#"
                method="post"
                enctype="multipart/form-data"
            >

                <div class="form-grid">

                    <div class="form-field">
                        <label for="nombre">Nombre completo</label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            required
                            autocomplete="name"
                        >
                    </div>

                    <div class="form-field">
                        <label for="correo">Correo electrónico</label>

                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            required
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-field">
                        <label for="telefono">Teléfono</label>

                        <input
                            type="tel"
                            id="telefono"
                            name="telefono"
                            required
                            autocomplete="tel"
                        >
                    </div>

                    <div class="form-field">
                        <label for="cargo">Cargo al que aspira</label>

                        <input
                            type="text"
                            id="cargo"
                            name="cargo"
                            required
                        >
                    </div>

                    <div class="form-field full">

                        <label for="cv">
                            Hoja de vida
                        </label>

                        <input
                            type="file"
                            id="cv"
                            name="cv"
                            accept=".pdf,.doc,.docx"
                            required
                            aria-describedby="cv-help"
                        >

                        <small id="cv-help" class="field-help">
                            Formatos permitidos: PDF, DOC y DOCX.
                        </small>

                    </div>

                    <div class="form-field full">

                        <label for="mensaje">
                            Mensaje de presentación
                        </label>

                        <textarea
                            id="mensaje"
                            name="mensaje"
                            maxlength="1000"
                            placeholder="Cuéntanos brevemente sobre ti..."
                        ></textarea>

                    </div>

                    <div class="form-field full">

                        <label class="choice">

                            <input
                                type="checkbox"
                                id="autorizacion"
                                name="autorizacion"
                                required
                            >

                            <span>
                                Autorizo el tratamiento de mis datos
                                para el proceso de selección.
                            </span>

                        </label>

                    </div>

                </div>

                <div class="form-actions">

                    <button type="submit" class="button-primary">
                        Enviar solicitud
                    </button>

                    <button type="reset" class="button-secondary">
                        Limpiar
                    </button>

                </div>

            </form>

        </section>
    </main>

</body>
</html>
